services:
  # --- INFRAESTRUTURA DE MENSAGERIA ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: banking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093,1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - quarkus-network

  # Visualizador do Kafka Leve (Disponível em http://localhost:9000)
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: banking-kafdrop
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:29092
      - JVM_OPTS=-Xms32M -Xmx64M
    depends_on:
      - kafka
    networks:
      - quarkus-network     

  # --- MICROSSERVIÇOS JAVA (QUARKUS) ---
  banking-service:
    image: carberilo/banking-service:1.0.0
    env_file:
      - ./banking-service/.env/.env   
    container_name: banking-service
    ports:
      - "8081:8081"
    # --- LIMITES DE MEMÓRIA DO CONTAINER ---
    depends_on:
      - kafka
    networks:
      - quarkus-network

  banking-validation:
    image: carberilo/banking-validation:1.0.0
    env_file:
      - ./banking-validation/.env/.env
    container_name: banking-validation
    ports:
      - "8082:8082"
    # --- LIMITES DE MEMÓRIA DO CONTAINER ---
    depends_on:
      - kafka
    networks:
      - quarkus-network

  banking-audit:
    image: carberilo/banking-audit:1.0.0
    env_file:
      - ./banking-audit/.env/.env
    container_name: banking-audit
    ports:
      - "8083:8083"
    # --- LIMITES DE MEMÓRIA DO CONTAINER ---
    depends_on:
      - kafka
    networks:
      - quarkus-network    

  # --- PLATAFORMA DE OBSERVABILIDADE ---
  prometheus:
    image: prom/prometheus:latest
    container_name: banking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./.prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - banking-service
      - banking-validation
      - banking-audit
    networks:
      - quarkus-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: banking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - quarkus-network
    restart: unless-stopped               

# --- MAPEAMENTO GLOBAL DE VOLUMES E REDES ---
volumes:
  grafana_data:
    driver: local

networks:
  quarkus-network:
    driver: bridge

